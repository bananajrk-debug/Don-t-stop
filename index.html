<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>止まれない機関車（仮）小人版</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2E2840; font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; }
  canvas { display: block; }
  #join { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(46,40,64,0.92); }
  #join .box { background: #F7EBD9; color: #2E2840; padding: 28px 36px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; width: 400px; }
  #join h1 { margin: 0; font-size: 28px; }
  #join input { font-size: 18px; padding: 10px 12px; border-radius: 8px; border: 2px solid #C9B8A3; }
  #join button { font-size: 18px; font-weight: 700; padding: 12px; border: 0; border-radius: 8px; background: #D94F3D; color: #fff; cursor: pointer; }
  #join p { margin: 0; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="join">
  <div class="box">
    <h1>止まれない機関車（小人版）</h1>
    <p>小人たちで巨大な機関車を動かして、ふもと村の停止線にぴったり止めよう。</p>
    <label for="name">なまえ</label>
    <input id="name" maxlength="10" placeholder="なまえ">
    <button id="go">乗車する</button>
    <p>←→/AD 移動　↑↓/WS はしご・飛び降り　Space ジャンプ<br>E 操作・拾う（長押しも）　Q 投げる・加減弁を閉じる<br>R 結果画面でもう一度／2秒長押しでリセット</p>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
// ===== 線路と列車の形（server.js と同じ） =====
const L = 16000, STEP = 10;
const FLATS = [[0, 900], [7500, 8500], [14800, 16000]];
const TOWER_X = 8000, STOP_FRONT = 15500, BUFFER_FRONT = 15700, FRONT = 560;
function rawSlope(x) {
  for (const f of FLATS) if (x >= f[0] && x <= f[1]) return 0;
  return 0.07 + 0.09 * Math.cos(x / 700) + 0.07 * Math.cos(x / 300 + 1);
}
const H = [0];
for (let i = 1; i <= L / STEP + 2; i++) H[i] = H[i - 1] + rawSlope((i - 0.5) * STEP) * STEP;
function ground(x) { x = Math.max(0, Math.min(L, x)); const i = Math.floor(x / STEP), t = x / STEP - i; return H[i] * (1 - t) + H[i + 1] * t; }
function trainAngle(x) { return Math.atan((ground(x + 400) - ground(x - 400)) / 800); }
const LADDERS = [
  { x: -545, top: -260, bottom: -20 }, { x: -150, top: -150, bottom: -20 }, { x: -250, top: -260, bottom: -150 },
  { x: -215, top: -300, bottom: -150 }, { x: -100, top: -470, bottom: -300 }, { x: -32, top: -400, bottom: -150 },
  { x: 422, top: -400, bottom: -150 },
];
const SPOT_POS = { coalpile: [-420, -260, '石炭の山'], waterin: [-300, -260, '給水口'], fire: [-75, -150, '焚き口'], brake: [-230, -150, 'ブレーキ'],
  reg: [-125, -300, '加減弁'], gauge: [-185, -300, '圧力計'], whistle: [-10, -400, '汽笛'], valve: [120, -400, '安全弁'] };
const PROMPT = {
  coalpile: '石炭の山：[E]で石炭を持つ', waterin: '給水口：給水塔の横で止まって[E]長押し',
  brake: 'ブレーキ：[E]長押し（2人で全力）', reg: '加減弁：[E]長押しで開く／[Q]長押しで閉じる（重い！2人だと4倍速い）',
  gauge: '圧力計：ここにいる間、みんなに圧力が見える', whistle: '汽笛のひも：[E]長押しでぶら下がる', valve: '安全弁：[E]長押しで圧力を抜く',
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, Hh = 0, Z = 1;
function resize() { W = cv.width = innerWidth; Hh = cv.height = innerHeight; Z = Math.max(0.5, Math.min(1, W / 1500)); }
addEventListener('resize', resize); resize();

const socket = io();
let myId = null, state = null, audio = null, whistleNode = null;
let camX = 600, camY = 0;
const smoke = [];

document.getElementById('go').onclick = () => {
  socket.emit('join', document.getElementById('name').value.trim() || 'ななし');
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  document.getElementById('join').style.display = 'none';
};
document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
socket.on('joined', d => { myId = d.id; });
socket.on('state', s => { state = s; whistleSound(s.g.whistling); });

function whistleSound(on) {
  if (!audio) return;
  if (on && !whistleNode) {
    const gn = audio.createGain(); gn.gain.value = 0.0001; gn.connect(audio.destination);
    const os = [523, 659, 784].map(f => { const o = audio.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.connect(gn); o.start(); return o; });
    gn.gain.exponentialRampToValueAtTime(0.08, audio.currentTime + 0.08);
    whistleNode = { gn, os };
  } else if (!on && whistleNode) {
    const w = whistleNode; whistleNode = null;
    w.gn.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.15);
    setTimeout(() => w.os.forEach(o => o.stop()), 200);
  }
}

// ===== 入力 =====
const keys = { l: false, r: false, u: false, d: false, j: false, e: false, q: false, rst: false };
const MAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', Space: 'j', KeyE: 'e', KeyQ: 'q', KeyR: 'rst' };
function setKey(e, v) {
  if (document.getElementById('join').style.display !== 'none') return;
  const k = MAP[e.code]; if (!k) return;
  e.preventDefault();
  if (keys[k] !== v) { keys[k] = v; socket.emit('input', keys); }
}
addEventListener('keydown', e => setKey(e, true));
addEventListener('keyup', e => setKey(e, false));
addEventListener('blur', () => { for (const k in keys) keys[k] = false; socket.emit('input', keys); });
setInterval(() => { if (myId) socket.emit('input', keys); }, 200);

// ===== 道具 =====
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function line(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function text(t, x, y, size, c, align) { ctx.font = `bold ${size}px sans-serif`; ctx.fillStyle = c; ctx.textAlign = align || 'center'; ctx.fillText(t, x, y); }
function toWorld(gx, lx, ly) {
  const a = trainAngle(gx), gy = ground(gx);
  return { x: gx + lx * Math.cos(a) - ly * Math.sin(a), y: gy + lx * Math.sin(a) + ly * Math.cos(a) };
}
function worldCam() { ctx.setTransform(Z, 0, 0, Z, W / 2 - camX * Z, Hh * 0.62 - camY * Z); }

// ===== 背景と線路 =====
function drawSky() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, Hh, '#F6C177'); rect(0, 0, W, Hh * 0.16, '#EE9A62');
  circ(W * 0.8, Hh * 0.22, 70, '#FFE2A0');
  for (const [par, col, base, amp] of [[0.05, '#C9746A', 0.5, 160], [0.12, '#8E4F63', 0.66, 120]]) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, Hh);
    for (let x = 0; x <= W + 40; x += 40) {
      const wx = x + camX * par;
      ctx.lineTo(x, Hh * base - amp * (0.5 + 0.5 * Math.sin(wx / 300) * Math.cos(wx / 700)));
    }
    ctx.lineTo(W, Hh); ctx.fill();
  }
}
function drawWorld() {
  worldCam();
  const x0 = Math.max(0, camX - W / 2 / Z - 60), x1 = Math.min(L, camX + W / 2 / Z + 60);
  const bottom = camY + Hh / Z;
  // 給水塔（小人から見ると巨大）
  if (Math.abs(TOWER_X - camX) < W / Z) {
    const gy = ground(TOWER_X);
    rect(TOWER_X - 160, gy - 600, 26, 600, '#6E4B30'); rect(TOWER_X + 134, gy - 600, 26, 600, '#6E4B30');
    line(TOWER_X - 147, gy - 560, TOWER_X + 147, gy - 120, '#6E4B30', 10); line(TOWER_X + 147, gy - 560, TOWER_X - 147, gy - 120, '#6E4B30', 10);
    rrect(TOWER_X - 200, gy - 820, 400, 240, 20, '#6FA8C9'); rect(TOWER_X - 216, gy - 840, 432, 26, '#2E2840');
    text('給水塔', TOWER_X, gy - 690, 40, '#2E2840');
  }
  station(-100, 1400, '#B5473A', '山の上駅');
  station(14700, 15720, '#3D7DD9', 'ふもと村駅');
  if (Math.abs(STOP_FRONT - camX) < W / Z) {
    const gy = ground(STOP_FRONT);
    rect(STOP_FRONT - 5, gy - 220, 10, 220, '#FFFFFF'); text('停止線', STOP_FRONT, gy - 232, 34, '#FFFFFF');
    const bx = BUFFER_FRONT + 30, by = ground(BUFFER_FRONT);
    rect(bx - 20, by - 160, 40, 160, '#D94F3D'); rect(bx - 44, by - 160, 88, 28, '#FFD45C');
  }
  // 地面
  ctx.fillStyle = '#4A3B5C'; ctx.beginPath(); ctx.moveTo(x0, bottom);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, ground(x) + 14);
  ctx.lineTo(x1, bottom); ctx.fill();
  for (let x = Math.floor(x0 / 60) * 60; x <= x1; x += 60) line(x, ground(x) + 8, x + 30, ground(x + 30) + 8, '#6B4F3A', 16);
  ctx.strokeStyle = '#E4DCCF'; ctx.lineWidth = 6; ctx.beginPath();
  for (let x = x0; x <= x1; x += 20) x === x0 ? ctx.moveTo(x, ground(x)) : ctx.lineTo(x, ground(x));
  ctx.stroke();
  for (let k = 2000; k < 15000; k += 2000) if (k > x0 && k < x1) {
    const gy = ground(k); rect(k - 6, gy - 120, 12, 120, '#F7EBD9');
    text(`停止線まで ${Math.round((STOP_FRONT - k) / 20)}m`, k, gy - 134, 30, '#F7EBD9');
  }
}
function station(a, b, roof, name) {
  if (b < camX - W / Z || a > camX + W / Z) return;
  const gy = ground(a);
  rect(a, gy - 60, b - a, 60, '#C9B8A3');
  rect(a + 60, gy - 760, 30, 700, '#6E4B30'); rect(b - 90, gy - 760, 30, 700, '#6E4B30');
  rect(a, gy - 800, b - a, 50, roof);
  rrect((a + b) / 2 - 220, gy - 730, 440, 100, 10, '#FFFFFF');
  text(name, (a + b) / 2, gy - 660, 60, '#2E2840');
}

// ===== 巨大機関車（列車の中の座標で描く） =====
function ladderDraw(l) {
  line(l.x - 9, l.top, l.x - 9, l.bottom, '#8C8494', 3); line(l.x + 9, l.top, l.x + 9, l.bottom, '#8C8494', 3);
  for (let y = l.top + 8; y < l.bottom; y += 14) line(l.x - 9, y, l.x + 9, y, '#8C8494', 3);
}
function drawTrain(gs) {
  const ph = gs.x / 70;
  // 炭水車
  rrect(-560, -255, 300, 200, 8, '#285C4D');
  rect(-560, -260, 300, 10, '#D9A441');
  const peak = -260 - 70 * (gs.coalStock / 30);
  ctx.fillStyle = '#2A2533'; ctx.beginPath(); ctx.moveTo(-550, -260); ctx.lineTo(-500, peak); ctx.lineTo(-380, peak + 8); ctx.lineTo(-340, -260); ctx.fill();
  rect(-312, -268, 24, 8, '#D9A441');
  for (const wx of [-490, -330]) { circ(wx, -45, 45, '#2A2533'); circ(wx, -45, 38, '#C4473A'); circ(wx, -45, 9, '#2A2533'); }
  // 運転台（中が見える断面）
  rect(-285, -470, 245, 320, '#1F3D35');
  rect(-285, -470, 14, 320, '#2F6B5A'); rect(-54, -470, 14, 230, '#2F6B5A');
  rrect(-295, -484, 265, 16, 4, '#2A2533');
  rrect(-260, -440, 60, 50, 6, '#FFE2A0'); rrect(-140, -440, 60, 50, 6, '#FFE2A0');
  rect(-240, -300, 150, 8, '#8A5A2B');
  // 加減弁レバー
  const ang = gs.reg * 1.0;
  line(-125, -300, -125 + Math.sin(ang) * 60, -300 - Math.cos(ang) * 60, '#2A2533', 8);
  circ(-125 + Math.sin(ang) * 60, -300 - Math.cos(ang) * 60, 9, '#D94F3D');
  // 圧力計
  circ(-185, -350, 26, '#F3E6D0'); ctx.strokeStyle = '#D9A441'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(-185, -350, 26, 0, 7); ctx.stroke();
  if (gs.pressure !== null) { const a = -2.2 + (gs.pressure / 125) * 4.4; line(-185, -350, -185 + Math.sin(a) * 20, -350 - Math.cos(a) * 20, gs.pressure > 100 ? '#D94F3D' : '#2A2533', 3); }
  else text('?', -185, -341, 26, '#8C8494');
  // ブレーキハンドル
  ctx.save(); ctx.translate(-230, -190); ctx.rotate(gs.brakeHeat / 10);
  ctx.strokeStyle = '#C4473A'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.stroke();
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 4); line(-22, 0, 22, 0, '#C4473A', 3); }
  ctx.restore(); rect(-233, -170, 6, 20, '#2A2533');
  // ボイラー
  rrect(-45, -395, 480, 240, 100, '#2F6B5A');
  rect(80, -395, 14, 240, '#D9A441'); rect(240, -395, 14, 240, '#D9A441');
  ctx.fillStyle = '#D9A441'; ctx.beginPath(); ctx.arc(120, -395, 45, Math.PI, 0); ctx.fill();
  rect(112, -452, 16, 14, '#D9A441');
  rrect(400, -395, 85, 240, 40, '#2A2533'); circ(470, -275, 34, '#3A3440');
  rect(330, -560, 50, 165, '#2A2533'); rrect(318, -576, 74, 22, 5, '#2A2533');
  circ(500, -330, 18, '#FFE08A');
  // 焚き口
  ctx.globalAlpha = Math.min(1, 0.35 + gs.fire / 110); rrect(-95, -205, 34, 50, 6, '#E8913A'); ctx.globalAlpha = 1;
  ctx.strokeStyle = '#2A2533'; ctx.lineWidth = 4; ctx.strokeRect(-95, -205, 34, 50);
  // 汽笛
  rect(-16, -450, 12, 50, '#D9A441'); rrect(-22, -460, 24, 14, 4, '#D9A441');
  line(-6, -440, -6, -405, '#8A5A2B', 2);
  // 通路・台枠・車輪
  rect(-45, -150, 590, 10, '#2A2533'); rect(-285, -150, 240, 8, '#3A3440');
  rect(-560, -140, 1120, 30, '#2A2533');
  ctx.fillStyle = '#C4473A'; ctx.beginPath(); ctx.moveTo(520, -110); ctx.lineTo(580, -8); ctx.lineTo(520, -8); ctx.fill();
  for (const wx of [40, 200, 360]) {
    circ(wx, -70, 70, '#2A2533'); circ(wx, -70, 61, '#C4473A'); circ(wx, -70, 12, '#2A2533');
    for (let i = 0; i < 8; i++) { const a = ph + i * Math.PI / 4; line(wx, -70, wx + Math.cos(a) * 58, -70 + Math.sin(a) * 58, '#9E3A2F', 4); }
  }
  line(40 + Math.cos(ph) * 30, -70 + Math.sin(ph) * 30, 360 + Math.cos(ph) * 30, -70 + Math.sin(ph) * 30, '#B9B2BC', 10);
  rect(-170, -60, 40, 6, '#8C8494'); rect(-560, -60, 45, 6, '#8C8494');
  LADDERS.forEach(ladderDraw);
  // 場所の名前
  for (const k in SPOT_POS) { const [x, y, n] = SPOT_POS[k]; text(n, x, y + 22, 13, 'rgba(255,255,255,0.75)'); }
}

function drawLittle(p, x, y, me) {
  rect(x - 5, y - 8, 4, 8, '#3A3550'); rect(x + 1, y - 8, 4, 8, '#3A3550');
  rrect(x - 6, y - 20, 12, 13, 4, p.color);
  circ(x, y - 25, 5, '#F1C9A5');
  ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y - 26, 6, Math.PI, 0); ctx.fill();
  if (p.carry) { circ(x, y - 40, 11, '#2A2533'); circ(x - 3, y - 43, 3, '#5A5470'); }
  const fs = 12 / Z; ctx.font = `bold ${fs}px sans-serif`; ctx.textAlign = 'center';
  const w = ctx.measureText(p.name).width + 8 / Z;
  ctx.fillStyle = 'rgba(28,22,40,0.7)'; ctx.fillRect(x - w / 2, y - (p.carry ? 56 : 36) - fs - 2, w, fs + 4);
  ctx.fillStyle = me ? '#FFD45C' : '#FFFFFF'; ctx.fillText(p.name, x, y - (p.carry ? 56 : 36));
}

function updateSmoke(gs, dt) {
  const ch = toWorld(gs.x, 355, -580);
  const n = (1 + gs.fire / 20) * dt * 10;
  for (let i = 0; i < n; i++) smoke.push({ x: ch.x, y: ch.y, vx: -gs.v * 0.25 - 30 + Math.random() * 30, vy: -60 - Math.random() * 40, r: 22, life: 1 });
  if (gs.venting) for (let i = 0; i < 4; i++) { const v = toWorld(gs.x, 120, -455); smoke.push({ x: v.x, y: v.y, vx: (Math.random() - 0.5) * 120, vy: -160, r: 10, life: 0.6, w: 1 }); }
  if (gs.whistling) { const v = toWorld(gs.x, -10, -462); smoke.push({ x: v.x, y: v.y, vx: -gs.v * 0.2, vy: -120, r: 8, life: 0.5, w: 1 }); }
  for (const s of smoke) { s.x += s.vx * dt; s.y += s.vy * dt; s.r += 30 * dt; s.life -= dt * 0.4; }
  while (smoke.length && smoke[0].life <= 0) smoke.shift();
  if (smoke.length > 400) smoke.splice(0, smoke.length - 400);
}
function drawSmoke() {
  for (const s of smoke) { ctx.globalAlpha = Math.max(0, s.life) * 0.8; circ(s.x, s.y, s.r, s.w ? '#FFFFFF' : '#E3DAD0'); }
  ctx.globalAlpha = 1;
}

// ===== HUD =====
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(28,22,40,0.82)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); }
function bar(x, y, w, label, val, max, col, right) {
  text(label, x, y, 13, '#FFFFFF', 'left'); text(String(right), x + w, y, 13, '#FFFFFF', 'right');
  rect(x, y + 5, w, 8, 'rgba(255,255,255,0.22)'); rect(x, y + 5, w * Math.max(0, Math.min(1, val / max)), 8, col);
}
function drawHUD(gs, me) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  panel(16, 16, 290, 268);
  text(String(Math.round(Math.abs(gs.v) / 10)), 30, 60, 40, '#FFD45C', 'left'); text('km/h（ぐらい）', 90, 58, 15, '#FFFFFF', 'left');
  if (gs.pressure !== null) bar(30, 88, 260, 'ボイラー圧力', gs.pressure, 125, gs.pressure > 100 ? '#D94F3D' : '#FFD45C', gs.pressure > 100 ? '危険！' : Math.round(gs.pressure));
  else { text('ボイラー圧力', 30, 88, 13, '#FFFFFF', 'left'); text(gs.danger ? 'シューシュー鳴ってる…' : '？？？', 290, 88, 13, gs.danger ? '#FF8A7A' : '#B9B2BC', 'right'); text('誰か圧力計を見て！', 30, 106, 12, '#B9B2BC', 'left'); }
  bar(30, 122, 260, '火力', gs.fire, 100, '#E8913A', Math.round(gs.fire));
  bar(30, 152, 260, '水', gs.water, 100, '#6FA8C9', Math.round(gs.water));
  bar(30, 182, 260, '石炭の山', gs.coalStock, 30, '#B9B2BC', Math.floor(gs.coalStock) + '個');
  bar(30, 212, 260, 'ブレーキ温度', gs.brakeHeat, 150, '#E8913A', gs.brakeHeat > 90 ? '焼けてる' : gs.brakeForce > 0 ? `効き${Math.round(gs.brakeForce * 100)}%` : '');
  bar(30, 242, 260, '加減弁', Math.max(0, gs.reg), 1, '#4FA36B', gs.reg < 0 ? `後退 ${Math.round(-gs.reg * 100)}%` : `${Math.round(gs.reg * 100)}%`);
  text(`機関車の耐久 ${Math.max(0, Math.round(gs.hp))}`, 30, 274, 13, '#FFFFFF', 'left');

  panel(W - 250, 16, 234, 50);
  text(`停止線まで ${Math.round((STOP_FRONT - gs.x - FRONT) / 20)}m`, W - 133, 48, 18, '#FFFFFF');

  gs.msgs.slice(-3).forEach((m, i) => {
    ctx.font = 'bold 20px sans-serif'; const w = ctx.measureText(m).width + 30;
    rect(W / 2 - w / 2, 18 + i * 38, w, 32, 'rgba(217,79,61,0.9)'); text(m, W / 2, 41 + i * 38, 20, '#FFFFFF');
  });

  if (me) {
    let t = null;
    if (me.on && me.spot) t = me.spot === 'fire' ? (me.carry ? '焚き口：[E]で石炭を入れる' : '焚き口：石炭を持ってきて[E]') : PROMPT[me.spot];
    if (me.on && me.carry && me.spot !== 'fire') t = (t ? t + '　' : '') + '[Q]で石炭を投げる（重いので遅い）';
    if (me.on && !t && LADDERS.some(l => Math.abs(me.lx - l.x) < 14 && (Math.abs(me.ly - l.top) < 3 || Math.abs(me.ly - l.bottom) < 3))) t = '↑↓ ではしごを使う';
    if (!me.on) {
      const ld = [-545, -150].map(x => toWorld(gs.x, x, -20));
      if (ld.some(w => Math.abs(me.wx - w.x) < 40)) t = '↑ ではしごに飛びつく！';
    }
    if (t) { ctx.font = 'bold 18px sans-serif'; const w = ctx.measureText(t).width + 30; panel(W / 2 - w / 2, Hh - 112, w, 38); text(t, W / 2, Hh - 86, 18, '#FFD45C'); }
    if (!me.on) {
      const d = gs.x - me.wx;
      if (Math.abs(d) > W / 2 / Z - 600) {
        const left = d < 0; panel(left ? 16 : W - 236, Hh / 2 - 26, 220, 52);
        text(`${left ? '◀ ' : ''}機関車 ${Math.round(Math.abs(d) / 20)}m${left ? '' : ' ▶'}`, left ? 126 : W - 126, Hh / 2 + 6, 18, '#FFD45C');
      }
    }
  }
  text('←→ 移動　↑↓ はしご　Space ジャンプ　E 操作・拾う　Q 投げる／加減弁を閉じる　R長押し リセット', W / 2, Hh - 16, 13, 'rgba(255,255,255,0.8)');

  if (gs.phase === 'result') {
    rect(0, 0, W, Hh, 'rgba(28,22,40,0.75)');
    const r = gs.result;
    if (r && r.ok) {
      text(r.crashed ? '車止めに激突して到着…' : 'ふもと村に到着！', W / 2, Hh / 2 - 60, 46, '#FFFFFF');
      text('★'.repeat(r.stars) + '☆'.repeat(3 - r.stars), W / 2, Hh / 2 + 10, 56, '#FFD45C');
      text(`停止線からのズレ ${(r.err / 20).toFixed(1)}m`, W / 2, Hh / 2 + 60, 22, '#FFFFFF');
    } else text('機関車が壊れた…', W / 2, Hh / 2, 46, '#FFFFFF');
    text('R でもう一度（20秒で自動的に最初から）', W / 2, Hh / 2 + 110, 20, '#FFFFFF');
  }
}

let lastT = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (state) {
    const gs = state.g;
    const me = state.players.find(p => p.id === myId);
    let tx = gs.x, ty = ground(gs.x) - 250;
    if (me) { const w = me.on ? toWorld(gs.x, me.lx, me.ly) : { x: me.wx, y: me.wy }; tx = w.x; ty = w.y - 60; }
    camX += (tx - camX) * Math.min(1, dt * 8); camY += (ty - camY) * Math.min(1, dt * 6);
    drawSky(); drawWorld();
    updateSmoke(gs, dt);
    worldCam();
    ctx.translate(gs.x, ground(gs.x)); ctx.rotate(trainAngle(gs.x));
    drawTrain(gs);
    for (const it of gs.items) { circ(it.lx, it.ly - 10, 11, '#2A2533'); circ(it.lx - 3, it.ly - 13, 3, '#5A5470'); }
    for (const p of state.players) if (p.on) drawLittle(p, p.lx, p.ly, p.id === myId);
    worldCam();
    drawSmoke();
    for (const p of state.players) if (!p.on) drawLittle(p, p.wx, p.wy, p.id === myId);
    drawHUD(gs, me);
  } else { ctx.setTransform(1, 0, 0, 1, 0, 0); rect(0, 0, W, Hh, '#2E2840'); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
